{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="auth-card card shadow-sm mx-auto">
  <div class="card-body p-4 p-md-5">
    <h1 class="h3 mb-2">Panel de administración</h1>
    <p class="text-secondary mb-4">Ingresa con tu usuario y contraseña.</p>
    <form action="{{ url_for('auth.iniciar_sesion') }}" method="post">
      <div class="mb-3"><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" name="username" required autofocus></div>
      <div class="mb-4"><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" required></div>
      <button class="btn btn-primary w-100">Ingresar</button>
    </form>
    <p class="small text-secondary mt-4 mb-0">Cuenta de evaluación: <code>profesor</code> / <code>Profesor123*</code></p>
  </div>
</section>
{% endblock %}
